[project]
name = "support-agent"
version = "1.0.0"
description = "AI customer support agent for e-commerce orders, returns, refunds and delivery tracking"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
